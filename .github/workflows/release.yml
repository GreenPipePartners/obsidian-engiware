name: Release plugin

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Check release tag
        run: npm run validate:release -- "$GITHUB_REF_NAME"
      - name: Attest the installable plugin files
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Engiware $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            dist/main.js dist/manifest.json dist/styles.css
